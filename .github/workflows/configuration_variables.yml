name: Testing configuration variables

on: workflow_dispatch

env:
  cloud: google-cloud

jobs:
  greeting_job:
    runs-on: ubuntu-latest
    env:
      greeting: Hello
    steps:
      - name: "Say hello to Luis"
      run: echo "$greeting $first_name is using $cloud with project ${{ vars.PROJECT_ID }}!"
      env:
        first_name: Luis
